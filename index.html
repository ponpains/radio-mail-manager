<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <title>ラジオ採用メール管理</title>
</head>
<body>
<header class="topbar">
  <div>
    <div class="eyebrow">RADIO MAIL MANAGER</div>
    <h1>採用メール</h1>
  </div>
  <button id="installBtn" class="icon-btn" hidden aria-label="ホーム画面に追加">＋</button>
</header>

<main>
  <section class="summary">
    <div><strong id="count">0</strong><span>採用</span></div>
    <div><strong id="showCount">0</strong><span>表示中</span></div>
    <button id="addBtn" class="primary">＋ 追加</button>
  </section>

  <section class="filters">
    <input id="search" type="search" placeholder="🔍 タイトル・本文・ラジオネームを検索">
    <div class="filter-row">
      <select id="programFilter"><option value="">番組：すべて</option></select>
      <select id="episodeFilter"><option value="">放送回：すべて</option></select>
      <select id="cornerFilter"><option value="">コーナー：すべて</option></select>
    </div>
  </section>

  <section class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>回</th>
          <th>ラジオネーム</th>
          <th>番組</th>
          <th>コーナー</th>
          <th>タイトル</th>
        </tr>
      </thead>
      <tbody id="mailTable"></tbody>
    </table>
  </section>
</main>

<nav class="bottom-nav">
  <button id="backupBtn">バックアップ</button>
  <button id="restoreBtn">復元</button>
  <button id="csvBtn">CSV書出</button>
  <input id="restoreInput" type="file" accept=".json,application/json" hidden>
</nav>

<dialog id="editDialog">
  <form method="dialog" id="mailForm">
    <div class="dialog-head">
      <h2 id="dialogTitle">採用メールを追加</h2>
      <button type="button" id="closeDialog" class="close">×</button>
    </div>
    <input type="hidden" id="mailId">
    <label>放送回<input id="episode" required placeholder="17回"></label>
    <label>放送日<input id="airDate" type="date"></label>
    <label>ラジオネーム<input id="name" required placeholder="ななお"></label>
    <label>番組<input id="program" required placeholder="けれけれ"></label>
    <label>コーナー<input id="corner" placeholder="リアクション"></label>
    <label>採用順<input id="order" type="number" min="1" placeholder="1"></label>
    <label>タイトル<input id="title" placeholder="おたがき"></label>
    <label>メール本文<textarea id="body" rows="8" placeholder="採用されたメール本文"></textarea></label>
    <label>Podcast URL<input id="podcast" type="url" placeholder="https://..."></label>
    <label>メモ<textarea id="memo" rows="3" placeholder="反応・感想など"></textarea></label>
    <div class="form-actions">
      <button type="button" id="deleteBtn" class="danger" hidden>削除</button>
      <span></span>
      <button type="button" id="cancelBtn" class="secondary">キャンセル</button>
      <button type="submit" class="primary">保存</button>
    </div>
  </form>
</dialog>

<dialog id="detailDialog">
  <div class="dialog-head">
    <h2 id="detailTitle">採用メール</h2>
    <button type="button" id="closeDetail" class="close">×</button>
  </div>
  <div id="detailContent"></div>
  <div class="form-actions">
    <button id="editFromDetail" class="secondary">編集</button>
    <span></span>
    <button id="closeDetail2" class="primary">閉じる</button>
  </div>
</dialog>

<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
