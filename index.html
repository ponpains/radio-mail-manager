<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
  <title>ラジオメールマネージャー</title>
</head>
<body>
<header class="topbar">
  <div><div class="eyebrow">RADIO MAIL MANAGER</div><h1>メールマネージャー</h1></div>
  <div class="top-actions">
    <button id="installBtn" class="icon-btn" hidden aria-label="ホーム画面に追加">＋</button>
    <button id="moreBtn" class="icon-btn more-btn" aria-label="その他">⋯</button>
  </div>
  <div id="moreMenu" class="more-menu" hidden>
    <button id="backupBtn">バックアップ</button>
    <button id="restoreBtn">復元</button>
    <button id="csvBtn">CSV書出</button>
    <input id="restoreInput" type="file" accept=".json,application/json" hidden>
  </div>
</header>

<main>
  <section class="program-tabs" id="programTabs"></section>
  <section class="summary">
    <div><strong id="count">0</strong><span>採用</span></div>
    <div><strong id="showCount">0</strong><span>表示中</span></div>
    <button id="addBtn" class="primary">＋ 追加</button>
  </section>
  <section class="filters">
    <input id="search" type="search" placeholder="🔍 ラジオネーム・コーナー・本文を検索">
    <div class="filter-row">
      <select id="episodeFilter"><option value="">放送回：すべて</option></select>
      <select id="cornerFilter"><option value="">コーナー：すべて</option></select>
    </div>
  </section>
  <section class="table-wrap">
    <table>
      <thead><tr><th>放送回</th><th>ラジオネーム</th><th>コーナー</th><th>本文</th></tr></thead>
      <tbody id="mailTable"></tbody>
    </table>
  </section>
</main>

<dialog id="editDialog">
  <form method="dialog" id="mailForm">
    <div class="dialog-head"><h2 id="dialogTitle">メールを追加</h2><button type="button" id="closeDialog" class="close">×</button></div>
    <div class="form-grid">
      <label>番組<input id="program" list="programList" placeholder="番組"><datalist id="programList"></datalist></label>
      <label>放送回<input id="episode" placeholder="放送回"></label>
      <label>放送日<input id="airDate" type="date"></label>
      <label>ラジオネーム<input id="name" list="nameList" placeholder="ラジオネーム"><datalist id="nameList"></datalist></label>
      <label>コーナー<input id="corner" list="cornerList" placeholder="コーナー"><datalist id="cornerList"></datalist></label>
      <label class="wide">メール本文<textarea id="body" rows="4" placeholder="メール本文"></textarea></label>
      <label class="wide">要約<textarea id="summary" rows="2" placeholder="要約"></textarea></label>
      <label class="wide">URL<input id="url" type="url" placeholder="https://..."></label>
      <label class="wide">メモ<textarea id="memo" rows="2" placeholder="メモ"></textarea></label>
    </div>
    <div class="form-actions sticky-actions">
      <button type="button" id="deleteBtn" class="danger" hidden>削除</button><span></span>
      <button type="button" id="cancelBtn" class="secondary">キャンセル</button><button type="submit" class="primary">保存</button>
    </div>
  </form>
</dialog>

<dialog id="detailDialog">
  <div class="dialog-head">
    <h2 id="detailTitle">メール詳細</h2>
    <button type="button" id="favoriteBtn" class="favorite-btn" aria-label="お気に入り">☆</button>
    <button type="button" id="closeDetail" class="close">×</button>
  </div>
  <div id="detailContent"></div>
  <div class="detail-actions">
    <button id="deleteFromDetailBtn" class="danger">削除</button>
    <button id="markAdoptedBtn" class="primary" hidden>採用メールに追加</button>
    <button id="editFromDetail" class="secondary">編集</button>
    <button id="closeDetail2" class="primary">閉じる</button>
  </div>
</dialog>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
