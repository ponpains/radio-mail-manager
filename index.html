<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css?v=ver14">
  <title>ラジオメールマネージャー</title>
</head>
<body>
<header class="topbar">
  <div><div class="eyebrow">RADIO MAIL MANAGER</div><h1>メールマネージャー <span class="version-label">ver.14</span></h1></div>
  <div class="top-actions">
    <button id="installBtn" class="icon-btn" hidden aria-label="ホーム画面に追加">＋</button>
    <button id="globalSearchBtn" class="icon-btn" aria-label="横断検索">⌕</button>
    <button id="moreBtn" class="icon-btn more-btn" aria-label="その他">⋯</button>
  </div>
  <div id="moreMenu" class="more-menu" hidden>
    <button id="backupBtn">バックアップ</button>
    <button id="restoreBtn">復元</button>
    <button id="csvBtn">CSV書出</button>
    <button id="csvImportBtn">CSV読込</button>
    <button id="themeBtn">テーマカラー</button>
    <button id="statsBtn">記録</button>
    <button id="programSettingsBtn">番組設定</button>
    <button id="settingsBtn">設定</button>
    <input id="restoreInput" type="file" accept=".json,application/json" hidden>
    <input id="csvImportInput" type="file" accept=".csv,text/csv" hidden>
  </div>
</header>
<div id="programMenu" class="context-menu" hidden>
  <button id="renameProgramBtn">名前の変更</button>
  <button id="deleteProgramBtn" class="danger-menu">削除</button>
  <button id="reorderProgramBtn">入れ替え</button>
</div>
<div id="memoMenu" class="context-menu memo-menu" hidden>
  <button id="editMemoMenuBtn">メモを編集</button>
  <button id="deleteMemoMenuBtn" class="danger-menu">メモを削除</button>
  <button id="copyMemoMenuBtn">コピー</button>
  <button id="memoToDraftMenuBtn">下書きにする</button>
</div>
<div id="draftMenu" class="context-menu draft-menu" hidden>
  <button id="editDraftMenuBtn">下書きを編集</button>
  <button id="deleteDraftMenuBtn" class="danger-menu">下書きを削除</button>
  <button id="duplicateDraftMenuBtn">下書きを複製</button>
  <button id="copyDraftMenuBtn">コピー</button>
  <button id="sendDraftMenuBtn">送信済みに追加</button>
</div>
<div id="sortMenu" class="context-menu sort-menu" hidden>
  <button data-sort="episodeAsc">放送回：昇順</button>
  <button data-sort="episodeDesc">放送回：降順</button>
  <button data-sort="addedDesc">追加日時：新しい順</button>
  <button data-sort="addedAsc">追加日時：古い順</button>
  <button data-sort="nameAsc">ラジオネーム順</button>
  <button data-sort="cornerAsc">コーナー順</button>
</div>

<main>
  <section class="program-tabs" id="programTabs"></section>
  <section class="summary" id="summaryBar">
    <div class="summary-stat"><strong id="count">0</strong><span id="countLabel">採用</span></div>
    <div class="summary-stat"><strong id="showCount">0</strong><span>表示中</span></div>
    <button id="programPostBtn" class="summary-icon-btn program-post-btn" type="button" aria-label="番組へメール・投稿">✉</button>
    <button id="sortBtn" class="summary-icon-btn sort-btn" type="button" aria-expanded="false" aria-label="並べ替え">↕</button>
    <button id="filterToggleBtn" class="summary-icon-btn" type="button" aria-expanded="false" aria-label="検索・絞り込み">🔍</button>
    <button id="addBtn" class="primary">＋ 追加</button>
  </section>
  <section class="filters collapsed">
    <input id="search" type="search" placeholder="🔍 ラジオネーム・コーナー・本文を検索">
    <div class="filter-row">
      <select id="programFilter" hidden><option value="">番組：すべて</option></select>
      <select id="nameFilter"><option value="">ラジオネーム：すべて</option></select>
      <select id="cornerFilter"><option value="">コーナー：すべて</option></select>
      <button id="periodFilterBtn" class="period-filter-btn" type="button">期間指定</button>
      <button id="favoriteFilterBtn" class="favorite-filter" type="button" aria-pressed="false">☆ お気に入り</button>
    </div>
  </section>
  <section class="table-wrap">
    <table>
      <thead><tr>
      <th>放送回</th>
      <th>ラジオネーム</th>
      <th>コーナー</th>
      <th>本文</th>
    </tr></thead>
      <tbody id="mailTable"></tbody>
    </table>
  </section>

<section id="draftView" class="draft-view" hidden><div id="draftTimeline" class="draft-timeline"></div></section>
<section id="memoView" class="memo-view" hidden>
  <div id="memoTimeline" class="memo-timeline"></div>
</section>

</main>

<dialog id="editDialog">
  <form method="dialog" id="mailForm">
    <div class="dialog-head">
      <h2 id="dialogTitle">メールを追加</h2>
      <button type="button" id="closeDialog" class="close">×</button>
    </div>

    <div class="detail-grid add-detail-grid">
      <div class="k">番組</div><div class="detail-gray"><input id="program" list="programList" placeholder="番組"><datalist id="programList"></datalist></div>
      <div class="k">放送回</div><div class="detail-gray"><input id="episode" placeholder="放送回"></div>
      <div class="k">放送日</div><div class="detail-gray"><input id="airDate" type="date"></div>
      <div class="k">ラジオネーム</div><div class="detail-gray"><input id="name" list="nameList" placeholder="ラジオネーム"><datalist id="nameList"></datalist></div>
      <div class="k">コーナー</div><div class="detail-gray"><input id="corner" list="cornerList" placeholder="コーナー"><datalist id="cornerList"></datalist></div>
    </div>

    <div class="detail-body detail-gray add-mail-body"><strong>メール本文</strong><br><textarea id="body" rows="8" placeholder="メール本文"></textarea></div>
    <div class="detail-body detail-gray add-mail-summary"><strong>要約</strong><br><textarea id="summary" rows="1" placeholder="要約"></textarea></div>
    <div class="detail-body detail-gray"><strong>URL</strong><br><input id="url" type="url" placeholder="https://..."></div>
    <div class="detail-body detail-gray add-mail-memo"><strong>メモ</strong><br><textarea id="memo" rows="1" placeholder="メモ"></textarea></div>
    <div class="label-editor"><input id="mailLabel" placeholder="ラベル（任意）" maxlength="20"><select id="mailLabelColor" aria-label="ラベル色"><option value="yellow">黄</option><option value="blue">青</option><option value="green">緑</option><option value="pink">桃</option><option value="purple">紫</option><option value="gray">灰</option></select></div>

    <div class="detail-actions">
      <button type="button" id="deleteBtn" class="danger" hidden>削除</button>
      <button type="button" id="cancelBtn" class="secondary">キャンセル</button>
      <button type="submit" class="primary">保存</button>
    </div>
  </form>
</dialog>

<dialog id="detailDialog">
  <div class="dialog-head">
    <h2 id="detailTitle">メール詳細</h2>
    <span id="detailCount" class="detail-count" hidden></span>
    <span id="detailAddedAt" class="detail-added-at" hidden></span>
    <button type="button" id="adoptHeaderBtn" class="adopt-header-btn" hidden>採用</button>
    <button type="button" id="favoriteBtn" class="favorite-btn" aria-label="お気に入り">☆</button>
    <button type="button" id="closeDetail" class="close">×</button>
  </div>
  <div id="detailContent"></div>
  <div class="detail-actions">
    <button id="copyBodyBtn" class="secondary">本文コピー</button>
    <button id="detailEditBtn" class="secondary">編集</button>
    <button id="detailDeleteBtn" class="danger">削除</button>
    <button id="markAdoptedBtn" class="primary" hidden>採用メールに追加</button>
    
    <button id="closeDetail2" class="primary">閉じる</button>
  </div>
</dialog>


<dialog id="programSettingsDialog" class="compact-dialog">
  <div class="dialog-head">
    <h2>番組設定</h2>
    <button type="button" id="closeProgramSettingsDialog" class="close">×</button>
  </div>
  <div class="program-settings-body">
    <label>番組<select id="programSettingsSelect"></select></label>
    <label>投稿フォームURL<input id="programFormUrl" type="url" placeholder="https://..."></label>
    <label>メールアドレス<input id="programEmail" type="email" placeholder="example@example.com"></label>
    <label>デフォルトのラジオネーム<input id="programDefaultName" placeholder="例：ななお"></label>
    <label>コーナー管理<textarea id="programCorners" rows="5" placeholder="1行に1コーナー
ふつおた
リアクション"></textarea></label>
    <div class="program-settings-actions">
      <button type="button" id="openProgramPostBtn" class="secondary">投稿先を開く</button>
      <button type="button" id="saveProgramSettingsBtn" class="primary">保存</button>
    </div>
  </div>
</dialog>


<dialog id="settingsDialog" class="compact-dialog">
  <div class="dialog-head">
    <h2>設定</h2>
    <button type="button" id="closeSettingsDialog" class="close">×</button>
  </div>
  <div class="app-settings-body">
    <label>文字サイズ
      <select id="fontSizeSetting">
        <option value="small">小</option><option value="medium">中</option><option value="large">大</option>
      </select>
    </label>
    <label>タブのサイズ
      <select id="tabSizeSetting">
        <option value="small">小</option><option value="medium">中</option><option value="large">大</option>
      </select>
    </label>
    <label>一覧の高さ
      <select id="rowSizeSetting">
        <option value="compact">コンパクト</option><option value="medium">標準</option><option value="large">ゆったり</option>
      </select>
    </label>
    <label>詳細情報欄
      <select id="detailDensitySetting">
        <option value="compact">コンパクト</option><option value="medium">標準</option><option value="large">ゆったり</option>
      </select>
    </label>
    <fieldset class="display-fields-setting"><legend>詳細画面の表示項目</legend>
      <label><input type="checkbox" id="showProgramSetting">番組</label>
      <label><input type="checkbox" id="showEpisodeSetting">放送回</label>
      <label><input type="checkbox" id="showAirDateSetting">放送日</label>
      <label><input type="checkbox" id="showNameSetting">ラジオネーム</label>
      <label><input type="checkbox" id="showCornerSetting">コーナー</label>
      <label><input type="checkbox" id="showSummarySetting">要約</label>
      <label><input type="checkbox" id="showUrlSetting">Podcast URL</label>
      <label><input type="checkbox" id="showMemoSetting">メモ</label>
    </fieldset>
    <div class="app-settings-note">表示設定は端末内に保存されます。非表示にしてもデータ自体は削除されません。</div>
    <div class="program-settings-actions">
      <button type="button" id="resetSettingsBtn" class="secondary">初期値に戻す</button>
      <button type="button" id="saveSettingsBtn" class="primary">保存</button>
    </div>
  </div>
</dialog>

<dialog id="statsDialog" class="compact-dialog">
  <div class="dialog-head">
    <h2>記録</h2>
    <button type="button" id="closeStatsDialog" class="close">×</button>
  </div>
  <div id="statsContent" class="stats-content"></div>
</dialog>


<dialog id="globalSearchDialog" class="search-dialog">
  <div class="dialog-head"><h2>横断検索</h2><button type="button" id="closeGlobalSearchDialog" class="close">×</button></div>
  <div class="global-search-body">
    <input id="globalSearchInput" type="search" placeholder="メモ・下書き・送信済・採用を検索">
    <div id="globalSearchResults" class="global-search-results"></div>
  </div>
</dialog>

<dialog id="themeDialog" class="compact-dialog">
  <div class="dialog-head">
    <h2>テーマカラー</h2>
    <button type="button" id="closeThemeDialog" class="close">×</button>
  </div>
  <div class="theme-grid">
    <button class="theme-choice" data-theme="green">グリーン</button>
    <button class="theme-choice" data-theme="blue">ブルー</button>
    <button class="theme-choice" data-theme="purple">パープル</button>
    <button class="theme-choice" data-theme="orange">オレンジ</button>
    <button class="theme-choice" data-theme="gray">グレー</button>
  </div>
</dialog>

<dialog id="periodDialog" class="compact-dialog">
  <div class="dialog-head">
    <h2>期間指定</h2>
    <button type="button" id="closePeriodDialog" class="close">×</button>
  </div>
  <div class="period-dialog-body">
    <label>開始日<input id="fromDateFilter" type="date"></label>
    <label>終了日<input id="toDateFilter" type="date"></label>
    <div class="period-dialog-actions">
      <button type="button" id="clearPeriodBtn" class="secondary">クリア</button>
      <button type="button" id="applyPeriodBtn" class="primary">適用</button>
    </div>
  </div>
</dialog>

<button id="fabAddBtn" class="fab-add" aria-label="メールを追加">＋</button>

<dialog id="memoDialog">
  <div class="dialog-head">
    <h2 id="memoDialogTitle">メモ</h2>
    <span id="memoDetailCount" class="detail-count" hidden></span>
    <button type="button" id="closeMemoDialog" class="close">×</button>
  </div>
  <div class="memo-dialog-body">
    <textarea id="memoDialogInput" maxlength="500" placeholder="メールのアイデアをメモ"></textarea>
    <div class="label-editor"><input id="memoLabel" placeholder="ラベル（任意）" maxlength="20"><select id="memoLabelColor"><option value="yellow">黄</option><option value="blue">青</option><option value="green">緑</option><option value="pink">桃</option><option value="purple">紫</option><option value="gray">灰</option></select></div>
    <div class="memo-dialog-meta"><span id="memoDialogCount">0 / 500</span><span id="memoDialogDate"></span></div>
  </div>
  <div class="detail-actions">
    <button id="memoToDraftBtn" class="secondary" hidden>下書きにコピー</button>
    <button id="memoDeleteBtn" class="danger" hidden>削除</button>
    <button id="memoCancelBtn" class="secondary">閉じる</button>
    <button id="memoSaveBtn" class="primary">保存</button>
  </div>
</dialog>

<dialog id="quickComposerDialog" class="composer-dialog">
  <div class="composer-head">
    <button type="button" id="closeComposerDialog" class="composer-close">×</button>
    <strong id="composerTitle">メモ</strong>
    <span id="composerTopCount" class="composer-top-count" hidden>0文字</span>
    <button type="button" id="composerSaveBtn" class="composer-save">保存</button>
  </div>
  <div id="draftFields" class="draft-fields" hidden>
    <input id="draftName" list="nameList" placeholder="ラジオネーム">
    <input id="draftCorner" list="cornerList" placeholder="コーナー">
  </div>
  <textarea id="composerText" maxlength="1000" placeholder="いま何を考えてる？"></textarea>
  <div class="composer-label-row"><input id="composerLabel" placeholder="ラベル" maxlength="20"><select id="composerLabelColor"><option value="yellow">黄</option><option value="blue">青</option><option value="green">緑</option><option value="pink">桃</option><option value="purple">紫</option><option value="gray">灰</option></select></div>
  <div class="composer-footer"><span id="composerCount">0 / 1000</span></div>
</dialog>
<div id="toast" class="toast"></div>
<script src="app.js?v=ver14"></script>
</body>
</html>
