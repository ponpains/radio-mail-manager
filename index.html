<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css?v=ver7">
  <title>ラジオメールマネージャー</title>
</head>
<body>
<header class="topbar">
  <div><div class="eyebrow">RADIO MAIL MANAGER</div><h1>メールマネージャー <span class="version-label">ver.7</span></h1></div>
  <div class="top-actions">
    <button id="installBtn" class="icon-btn" hidden aria-label="ホーム画面に追加">＋</button>
    <button id="moreBtn" class="icon-btn more-btn" aria-label="その他">⋯</button>
  </div>
  <div id="moreMenu" class="more-menu" hidden>
    <button id="backupBtn">バックアップ</button>
    <button id="restoreBtn">復元</button>
    <button id="csvBtn">CSV書出</button>
    <button id="themeBtn">テーマカラー</button>
    <button id="statsBtn">記録</button>
    <button id="programSettingsBtn">番組設定</button>
    <input id="restoreInput" type="file" accept=".json,application/json" hidden>
  </div>
</header>
<div id="programMenu" class="context-menu" hidden>
  <button id="renameProgramBtn">名前の変更</button>
  <button id="deleteProgramBtn" class="danger-menu">削除</button>
</div>


<main>
  <section class="program-tabs" id="programTabs"></section>
  <section class="summary" id="summaryBar">
    <div class="summary-stat"><strong id="count">0</strong><span id="countLabel">採用</span></div>
    <div class="summary-stat"><strong id="showCount">0</strong><span>表示中</span></div>
    <button id="addBtn" class="primary">＋ 追加</button>
    <button id="filterToggleBtn" class="summary-icon-btn" type="button" aria-expanded="false" aria-label="検索・絞り込み">🔍</button>
  </section>
  <section class="filters collapsed">
    <input id="search" type="search" placeholder="🔍 ラジオネーム・コーナー・本文を検索">
    <div class="filter-row">
      <select id="nameFilter"><option value="">ラジオネーム：すべて</option></select>
      <select id="cornerFilter"><option value="">コーナー：すべて</option></select>
      <button id="periodFilterBtn" class="period-filter-btn" type="button">期間指定</button>
      <button id="favoriteFilterBtn" class="favorite-filter" type="button" aria-pressed="false">☆ お気に入り</button>
    </div>
  </section>
  <section class="table-wrap">
    <table>
      <thead><tr>
      <th>放送回</th>
      <th>ラジオネーム</th>
      <th>コーナー</th>
      <th>本文</th>
    </tr></thead>
      <tbody id="mailTable"></tbody>
    </table>
  </section>

<section id="draftView" class="draft-view" hidden><div id="draftTimeline" class="draft-timeline"></div></section>
<section id="memoView" class="memo-view" hidden>
  <div id="memoTimeline" class="memo-timeline"></div>
</section>

</main>

<dialog id="editDialog">
  <form method="dialog" id="mailForm">
    <div class="dialog-head">
      <h2 id="dialogTitle">メールを追加</h2>
      <button type="button" id="closeDialog" class="close">×</button>
    </div>

    <div class="detail-grid add-detail-grid">
      <div class="k">番組</div><div class="detail-gray"><input id="program" list="programList" placeholder="番組"><datalist id="programList"></datalist></div>
      <div class="k">放送回</div><div class="detail-gray"><input id="episode" placeholder="放送回"></div>
      <div class="k">放送日</div><div class="detail-gray"><input id="airDate" type="date"></div>
      <div class="k">ラジオネーム</div><div class="detail-gray"><input id="name" list="nameList" placeholder="ラジオネーム"><datalist id="nameList"></datalist></div>
      <div class="k">コーナー</div><div class="detail-gray"><input id="corner" list="cornerList" placeholder="コーナー"><datalist id="cornerList"></datalist></div>
    </div>

    <div class="detail-body detail-gray"><strong>メール本文</strong><br><textarea id="body" rows="5" placeholder="メール本文"></textarea></div>
    <div class="detail-body detail-gray"><strong>要約</strong><br><textarea id="summary" rows="2" placeholder="要約"></textarea></div>
    <div class="detail-body detail-gray"><strong>URL</strong><br><input id="url" type="url" placeholder="https://..."></div>
    <div class="detail-body detail-gray"><strong>メモ</strong><br><textarea id="memo" rows="2" placeholder="メモ"></textarea></div>

    <div class="detail-actions">
      <button type="button" id="deleteBtn" class="danger" hidden>削除</button>
      <button type="button" id="cancelBtn" class="secondary">キャンセル</button>
      <button type="submit" class="primary">保存</button>
    </div>
  </form>
</dialog>

<dialog id="detailDialog">
  <div class="dialog-head">
    <h2 id="detailTitle">メール詳細</h2>
    <button type="button" id="favoriteBtn" class="favorite-btn" aria-label="お気に入り">☆</button>
    <button type="button" id="closeDetail" class="close">×</button>
  </div>
  <div id="detailContent"></div>
  <div class="detail-actions">
    <button id="copyBodyBtn" class="secondary">本文コピー</button>
    <button id="detailDeleteBtn" class="danger">削除</button>
    <button id="markAdoptedBtn" class="primary" hidden>採用メールに追加</button>
    
    <button id="closeDetail2" class="primary">閉じる</button>
  </div>
</dialog>


<dialog id="programSettingsDialog" class="compact-dialog">
  <div class="dialog-head">
    <h2>番組設定</h2>
    <button type="button" id="closeProgramSettingsDialog" class="close">×</button>
  </div>
  <div class="program-settings-body">
    <label>番組<select id="programSettingsSelect"></select></label>
    <label>投稿フォームURL<input id="programFormUrl" type="url" placeholder="https://..."></label>
    <label>メールアドレス<input id="programEmail" type="email" placeholder="example@example.com"></label>
    <label>放送曜日<input id="programWeekday" placeholder="例：毎週火曜"></label>
    <div class="program-settings-actions">
      <button type="button" id="openProgramPostBtn" class="secondary">投稿先を開く</button>
      <button type="button" id="saveProgramSettingsBtn" class="primary">保存</button>
    </div>
  </div>
</dialog>

<dialog id="statsDialog" class="compact-dialog">
  <div class="dialog-head">
    <h2>記録</h2>
    <button type="button" id="closeStatsDialog" class="close">×</button>
  </div>
  <div id="statsContent" class="stats-content"></div>
</dialog>

<dialog id="themeDialog" class="compact-dialog">
  <div class="dialog-head">
    <h2>テーマカラー</h2>
    <button type="button" id="closeThemeDialog" class="close">×</button>
  </div>
  <div class="theme-grid">
    <button class="theme-choice" data-theme="green">グリーン</button>
    <button class="theme-choice" data-theme="blue">ブルー</button>
    <button class="theme-choice" data-theme="purple">パープル</button>
    <button class="theme-choice" data-theme="orange">オレンジ</button>
    <button class="theme-choice" data-theme="gray">グレー</button>
  </div>
</dialog>

<dialog id="periodDialog" class="compact-dialog">
  <div class="dialog-head">
    <h2>期間指定</h2>
    <button type="button" id="closePeriodDialog" class="close">×</button>
  </div>
  <div class="period-dialog-body">
    <label>開始日<input id="fromDateFilter" type="date"></label>
    <label>終了日<input id="toDateFilter" type="date"></label>
    <div class="period-dialog-actions">
      <button type="button" id="clearPeriodBtn" class="secondary">クリア</button>
      <button type="button" id="applyPeriodBtn" class="primary">適用</button>
    </div>
  </div>
</dialog>

<button id="fabAddBtn" class="fab-add" aria-label="メールを追加">＋</button>

<dialog id="memoDialog">
  <div class="dialog-head">
    <h2 id="memoDialogTitle">メモ</h2>
    <button type="button" id="closeMemoDialog" class="close">×</button>
  </div>
  <div class="memo-dialog-body">
    <textarea id="memoDialogInput" maxlength="500" placeholder="メールのアイデアをメモ"></textarea>
    <div class="memo-dialog-meta"><span id="memoDialogCount">0 / 500</span><span id="memoDialogDate"></span></div>
  </div>
  <div class="detail-actions">
    <button id="memoToDraftBtn" class="secondary" hidden>下書きにする</button>
    <button id="memoDeleteBtn" class="danger" hidden>削除</button>
    <button id="memoCancelBtn" class="secondary">閉じる</button>
    <button id="memoSaveBtn" class="primary">保存</button>
  </div>
</dialog>

<dialog id="quickComposerDialog" class="composer-dialog">
  <div class="composer-head">
    <button type="button" id="closeComposerDialog" class="composer-close">×</button>
    <strong id="composerTitle">メモ</strong>
    <button type="button" id="composerSaveBtn" class="composer-save">保存</button>
  </div>
  <div id="draftFields" class="draft-fields" hidden>
    <input id="draftName" list="nameList" placeholder="ラジオネーム">
    <input id="draftCorner" list="cornerList" placeholder="コーナー">
  </div>
  <textarea id="composerText" maxlength="1000" placeholder="いま何を考えてる？"></textarea>
  <div class="composer-footer"><span id="composerCount">0 / 1000</span></div>
</dialog>
<div id="toast" class="toast"></div>
<script src="app.js?v=ver7"></script>
</body>
</html>
